name: Build APK

on:
  push:
    branches: [main]
    paths: ['.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create Capacitor project
        run: |
          mkdir app && cd app
          npm init -y >/dev/null
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          mkdir www
          cp ../index.html ../manifest.webmanifest ../sw.js ../version.txt www/
          cp -r ../icons www/
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.angel.tazai",
            "appName": "他在",
            "webDir": "www",
            "server": {
              "url": "https://suneliwen-debug.github.io/tazai/",
              "allowNavigation": ["suneliwen-debug.github.io", "generativelanguage.googleapis.com", "ark.ap-southeast.bytepluses.com"]
            },
            "android": { "backgroundColor": "#1b1f4a" }
          }
          JSON
          npx cap add android

      - name: App icon and name
        run: |
          pip install --quiet pillow
          cd app/android/app/src/main/res
          python3 - <<'PY'
          import os, glob
          from PIL import Image, ImageDraw
          src = Image.open(os.environ["GITHUB_WORKSPACE"]+"/icons/icon-512-v3.png").convert("RGBA")
          sizes = {"mdpi":48,"hdpi":72,"xhdpi":96,"xxhdpi":144,"xxxhdpi":192}
          fg_sizes = {"mdpi":108,"hdpi":162,"xhdpi":216,"xxhdpi":324,"xxxhdpi":432}
          for d,s in sizes.items():
              p = f"mipmap-{d}"; os.makedirs(p, exist_ok=True)
              sq = src.resize((s,s), Image.LANCZOS); sq.save(f"{p}/ic_launcher.png")
              m = Image.new("L",(s,s),0); ImageDraw.Draw(m).ellipse([0,0,s-1,s-1],fill=255)
              r = Image.new("RGBA",(s,s),(0,0,0,0)); r.paste(sq,(0,0),m); r.save(f"{p}/ic_launcher_round.png")
              f = fg_sizes[d]; fg = Image.new("RGBA",(f,f),(0,0,0,0)); inner = int(f*0.72)
              fg.paste(src.resize((inner,inner), Image.LANCZOS), ((f-inner)//2,(f-inner)//2)); fg.save(f"{p}/ic_launcher_foreground.png")
          PY
          sed -i 's#<color name="ic_launcher_background">.*</color>#<color name="ic_launcher_background">\#2b2f7a</color>#' values/ic_launcher_background.xml || true
          sed -i 's#<string name="app_name">.*</string>#<string name="app_name">他在</string>#; s#<string name="title_activity_main">.*</string>#<string name="title_activity_main">他在</string>#' values/strings.xml

      - name: Microphone permission
        run: |
          cd app/android/app/src/main
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />#' AndroidManifest.xml

      - name: Build
        run: |
          cd app && npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../tazai.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: 他在 App（第 ${{ github.run_number }} 版）
          body: 用手机下载 tazai.apk 安装。
          files: tazai.apk
          make_latest: true
